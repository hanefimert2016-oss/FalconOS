# FalconOS boots straight to the kernel after firmware boot.
# GRUB remains our multiboot2 loader but exposes no interactive OS menu.
# The framebuffer is selected by firmware/GRUB, then adapted at runtime.
set timeout_style=hidden
set timeout=0
set default=0
set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
insmod vbe
insmod vga
terminal_output gfxterm
menuentry "FalconOS" --id=falconos {
    set gfxpayload=keep
    multiboot2 /boot/falcon.elf
    boot
}
