## =============================================================================
##  FalconOS 1 — GRUB2 boot menu
## -----------------------------------------------------------------------------
##  Single ISO supports HD / FHD / 2K. GRUB sets gfxmode before handing
##  control to the kernel; the multiboot2 framebuffer tag is honoured at
##  the matching size and the kernel auto-adapts to whatever resolution
##  the framebuffer driver reports back at runtime (no rebuild required).
## =============================================================================

set timeout=5
set default=1               # default to 1080p

# Make sure GRUB itself is in graphics mode so gfxpayload=keep works.
insmod all_video
insmod gfxterm
insmod vbe
insmod vga
terminal_output gfxterm

menuentry "FalconOS 1  (1280 x 800,  HD)" {
    set gfxmode=1280x800x32
    set gfxpayload=keep
    multiboot2 /boot/falcon.elf
    boot
}

menuentry "FalconOS 1  (1920 x 1080,  Full HD)" {
    set gfxmode=1920x1080x32
    set gfxpayload=keep
    multiboot2 /boot/falcon.elf
    boot
}

menuentry "FalconOS 1  (2560 x 1440,  2K)" {
    set gfxmode=2560x1440x32
    set gfxpayload=keep
    multiboot2 /boot/falcon.elf
    boot
}

menuentry "FalconOS 1  (auto / let firmware choose)" {
    set gfxpayload=keep
    multiboot2 /boot/falcon.elf
    boot
}
