name: FalconOS ISO Build

on:
  push:
    branches: [ "main", "release" ]
  workflow_dispatch: # Manuel tetiklemeye izin verir

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Kaynak Kodunu Cek
        uses: actions/checkout@v4

      - name: Derleme Bagimliliklarini Kur
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            nasm \
            xorriso \
            grub-pc-bin \
            grub-common \
            mtools \
            qemu-system-x86

      - name: Cekirdegi Derle ve ISO Olustur
        run: |
          # Eger deponuzda hazir Makefile varsa:
          if [ -f Makefile ]; then
            make iso || make
          fi

          # Eger Makefile'da iso hedefi yoksa manuel paketleme adimi:
          if [ ! -f falconos.iso ] && [ -f build/falconos.bin ]; then
            mkdir -p isodir/boot/grub
            cp build/falconos.bin isodir/boot/falconos.bin
            cat << 'EOF' > isodir/boot/grub/grub.cfg
            set timeout=0
            set default=0
            menuentry "FalconOS" {
                multiboot /boot/falconos.bin
                boot
            }
          EOF
            grub-mkrescue -o falconos.iso isodir
          fi

      - name: ISO Dosyasini Artifact Olarak Kaydet
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-ISO
          path: "*.iso"
          if-no-files-found: error
          retention-days: 14
          
