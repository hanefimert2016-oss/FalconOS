name: FalconOS safe storage and ISO
on:
  push:
    branches: [FalconOS-1-release, 'fix/**', 'feature/core-storage-net-usermode']
  pull_request:
    branches: [FalconOS-1-release]
concurrency:
  group: core-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kernel toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-common grub-pc-bin xorriso mtools
      - name: Test disk image creation
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Test disk persistence with ATA mocks
        run: |
          mkdir -p build
          gcc -std=gnu11 -Wall -Wextra -Werror -Ikernel tests/diskdb_test.c kernel/diskdb.c -o build/test-diskdb
          ./build/test-diskdb
      - name: Test native Marketplace persistence
        run: |
          gcc -std=gnu11 -Wall -Wextra -Ikernel tests/market_storage_test.c kernel/shfs.c kernel/market_data.c -o build/test-market-cache
          ./build/test-market-cache
      - name: Test native Marketplace serial protocol
        run: |
          gcc -std=gnu11 -Wall -Wextra -Ikernel tests/market_protocol_test.c kernel/marketplace.c kernel/shfs.c kernel/market_version.c kernel/fapp_policy.c -o build/test-market-protocol
          ./build/test-market-protocol
      - name: Test SemVer precedence
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -Ikernel tests/market_version_test.c kernel/market_version.c -o build/test-semver
          ./build/test-semver
      - name: Test CodeDium package builder
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -Ikernel tests/codedium_package_test.c kernel/codedium_pkg.c kernel/market_version.c kernel/fapp_policy.c -o build/test-codedium-pkg
          ./build/test-codedium-pkg
      - name: Test durable SHFS PFS1 records
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -Ikernel tests/pfs_test.c kernel/shfs.c kernel/pfs.c -o build/test-pfs
          ./build/test-pfs
      - name: Test independent FVM application scheduler
        run: |
          gcc -std=gnu11 -Wall -Wextra -Werror -Ikernel tests/fvm_test.c kernel/fvm.c -o build/test-fvm
          ./build/test-fvm
      - name: Test native Ethernet ARP/ICMP framing
        run: |
          gcc -std=gnu11 -Wall -Wextra -Ikernel tests/native_net_test.c kernel/net_native.c -o build/test-net-native
          ./build/test-net-native
      - name: Compile ISO
        run: make iso
      - name: Validate Multiboot2 kernel
        run: grub-file --is-x86-multiboot2 build/falcon.elf
      - name: Install QEMU for graphical boot smoke
        run: sudo apt-get install -y qemu-system-x86
      - name: Boot QEMU and verify graphical framebuffer
        run: timeout 75s python3 tools/qemu_smoke.py --boot-seconds 20
      - name: Upload graphical smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-boot-screenshot
          path: build/falcon-boot-smoke.png
          if-no-files-found: ignore
      - name: QEMU scripted installer and Store navigation (experimental)
        continue-on-error: true
        run: timeout 90s python3 tools/qemu_ui_smoke.py
      - name: Upload Store UI screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-Store-UI
          path: build/FalconOS-Store-screen.png
          if-no-files-found: ignore
      - name: End-to-end Marketplace COM1 download and launch (simulated Release)
        run: timeout 150s python3 tools/qemu_market_e2e.py
      - name: Upload Marketplace end-to-end screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-market-e2e-screen
          path: |
            build/FalconOS-market-e2e.png
            build/market-e2e-debug.log
          if-no-files-found: ignore
      - name: Upload FalconOS ISO
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-safe-ISO
          path: build/FalconOS.iso

  native-network:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU and kernel build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-common grub-pc-bin xorriso mtools qemu-system-x86
      - name: Build network-instrumented kernel and ISO
        run: make iso EXTRA_CFLAGS='-DFALCON_QEMU_NET_TEST -DFALCON_QEMU_TCP_TEST'
      - name: Verify actual guest-to-gateway ICMP exchange
        run: python3 tools/qemu_net_e2e.py --timeout 65 --require-dns
      - name: Verify guest-native TCP and HTTP against live QEMU host
        run: python3 tools/qemu_tcp_e2e.py --timeout 70
      - name: Upload network diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-native-net-debug
          path: |
            build/net-smoke-debug.log
            build/tcp-smoke-debug.log
          if-no-files-found: ignore

  tls-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install TLS and bare-metal build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-common grub-pc-bin xorriso mtools python3-cryptography ca-certificates
      - name: Compile BearSSL HTTPS-enabled FalconOS ISO (no insecure fallback)
        run: make iso ENABLE_BEARSSL=1 ENABLE_NATIVE_MARKET=1
      - name: Check BearSSL kernel has valid Multiboot2 header
        run: grub-file --is-x86-multiboot2 build/falcon.elf
      - name: Upload experimental TLS ISO
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-BearSSL-experimental-ISO
          path: build/FalconOS.iso

  native-https-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain, TLS compiler and QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm grub-common grub-pc-bin xorriso mtools qemu-system-x86 python3-cryptography openssl
      - name: Create test-only local certificate authority and valid/invalid leaves
        run: |
          mkdir -p build/tls-test
          cd build/tls-test
          openssl ecparam -name prime256v1 -genkey -noout -out ca.key
          openssl req -x509 -new -sha256 -key ca.key -out ca.pem -days 2 -subj '/CN=FalconOS CI Test CA' -addext 'basicConstraints=critical,CA:TRUE' -addext 'keyUsage=critical,keyCertSign,cRLSign'
          openssl ecparam -name prime256v1 -genkey -noout -out server.key
          openssl req -new -sha256 -key server.key -out server.csr -subj '/CN=falcon.test'
          printf 'subjectAltName=DNS:falcon.test\nbasicConstraints=critical,CA:FALSE\nextendedKeyUsage=serverAuth\nkeyUsage=digitalSignature,keyEncipherment\n' > good.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out server.pem -days 2 -extfile good.ext
          printf 'subjectAltName=DNS:wrong.test\nbasicConstraints=critical,CA:FALSE\nextendedKeyUsage=serverAuth\nkeyUsage=digitalSignature,keyEncipherment\n' > bad.ext
          openssl x509 -req -in server.csr -CA ca.pem -CAkey ca.key -CAcreateserial -out bad.pem -days 2 -extfile bad.ext
      - name: Compile test-only native HTTPS-enabled ISO with CI CA root
        run: make iso ENABLE_BEARSSL=1 TLS_CA_BUNDLE=build/tls-test/ca.pem ENABLE_NATIVE_MARKET=1 EXTRA_CFLAGS=-DFALCON_QEMU_TLS_TEST
      - name: Verify real TLS 1.2 HTTP and certificate hostname
        run: python3 tools/qemu_tls_e2e.py --certificate build/tls-test/server.pem --key build/tls-test/server.key
      - name: Verify invalid certificate hostname is rejected
        run: python3 tools/qemu_tls_e2e.py --certificate build/tls-test/bad.pem --key build/tls-test/server.key --expect-failure
      - name: Upload HTTPS boot/debug records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-native-HTTPS-test
          path: build/tls-smoke-debug.log
          if-no-files-found: ignore
