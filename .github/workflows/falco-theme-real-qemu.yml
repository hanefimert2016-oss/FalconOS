name: Falco V2 adaptive palette real QEMU screenshots
on:
  push:
    branches: [feature/falco-codedium-engine-20261011]
    paths:
      - kernel/falco_theme.c
      - kernel/falco_theme.h
      - kernel/apps.c
      - kernel/falco_native_layout.c
      - tools/vnc_falco_falconos_tech_visual_e2e.py
      - .github/workflows/falco-theme-real-qemu.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  theme-fidelity:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Install compiler / font / real QEMU VNC dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm grub-common grub-pc-bin xorriso mtools qemu-system-x86 fonts-dejavu-core python3-venv
          python3 -m venv /tmp/falco-theme-venv
          /tmp/falco-theme-venv/bin/pip install --quiet pillow vncdotool
      - name: Run Python regression suite
        run: /tmp/falco-theme-venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Compile actual FalconOS ISO, native 2560x1440 theme builds
        run: |
          PATH="/tmp/falco-theme-venv/bin:$PATH" make iso ENABLE_BOOT_GLB=0 ENABLE_BEARSSL=0 EXTRA_CFLAGS='-DFALCON_QEMU_BROWSER_TEST -DFALCON_QEMU_UI_GALLERY -DFALCON_QEMU_FALCO_THEME_TEST'
          grub-file --is-x86-multiboot2 build/falcon.elf
      - name: Visit REAL falconos.tech and capture original Liquid, Dark and Light QEMU pixels
        env:
          FALCO_THEME_AUDIT: "1"
        run: timeout 410s /tmp/falco-theme-venv/bin/python tools/vnc_falco_falconos_tech_visual_e2e.py
      - name: Upload ORIGINAL unmodified QEMU screenshots and pixel tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Falco-V2-Native-Light-Dark-Liquid-QEMU
          path: |
            build/FalconOS-Falco-Theme-*.png
            build/FalconOS-Falco-Tech-*.png
            build/falco-tech-results.json
            build/falco-tech-*.log
          if-no-files-found: warn
          retention-days: 30
      - name: Upload verified bootable FalconOS ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-Falco-Adaptive-Theme-Verified-ISO
          path: build/FalconOS.iso
