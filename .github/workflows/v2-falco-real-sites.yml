name: FalconOS V2 — real 6-site native Falco HTML screenshot audit
on:
  push:
    branches: ['v2']
    paths:
      - 'tools/qemu_v2_real_sites.py'
      - '.github/workflows/v2-falco-real-sites.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  real-html-sites:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Install UEFI guest and screenshot packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm xorriso mtools qemu-system-x86 ovmf clang lld binutils ca-certificates python3-pil fonts-dejavu-core
      - name: Build FalconOS native MiniWeb V2
        run: make iso ENABLE_BOOT_GLB=0 ENABLE_BEARSSL=0 EXTRA_CFLAGS='-DFALCON_QEMU_BROWSER_TEST -DFALCON_QEMU_UI_GALLERY'
      - name: Fetch actual HTTPS and photograph six pages inside FalconOS guest
        run: timeout 650s python3 -u tools/qemu_v2_real_sites.py
      - name: Verify six observed guest-to-host HTTPS site attempts
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          p=Path("build/falco-v2-websites")
          r=json.loads((p/"falco-v2-real-sites.json").read_text())
          assert len(r["results"])==6
          assert all(x.get("attempted") for x in r["results"]), r["results"]
          for x in r["results"]:
              q=Path(x["screenshot"]);assert q.is_file(),q
              im=Image.open(q);assert im.width>=640 and im.height>=400,im.size
          q=p/"Falco-V2-six-real-websites.png";assert q.is_file(),q
          print("PASS: six actual Falco QEMU guest screenshots",r["counts"])
          PY
      - name: Upload actual native guest screenshot collage and individual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-V2-real-websites-QEMU-PNG
          if-no-files-found: ignore
          retention-days: 30
          path: |
            build/falco-v2-websites/*.png
            build/falco-v2-websites/*.json
            build/falco-v2-websites/*.log
