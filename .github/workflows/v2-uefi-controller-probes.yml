name: FalconOS V2 UEFI controller probes
on:
  push:
    branches: ['work/v2-sequential-hardening-20261030']
    paths:
      - 'kernel/**'
      - 'linux/**'
      - 'tools/qemu_uefi_controller_e2e.py'
      - '.github/workflows/v2-uefi-controller-probes.yml'
  pull_request:
    branches: ['v2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qemu-only-controller-probes:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Install UEFI toolchain and QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm xorriso mtools qemu-system-x86 ovmf clang lld binutils
      - name: Build xHCI test-only UEFI image and verify real QEMU command ring
        run: |
          make iso ENABLE_BOOT_GLB=0 ENABLE_BEARSSL=0 EXTRA_CFLAGS='-DFALCON_QEMU_XHCI_CMD_TEST'
          python3 tools/qemu_uefi_controller_e2e.py xhci
      - name: Rebuild separate NVMe test-only UEFI image and verify Identify
        run: |
          make clean
          make iso ENABLE_BOOT_GLB=0 ENABLE_BEARSSL=0 EXTRA_CFLAGS='-DFALCON_QEMU_NVME_ID_TEST'
          python3 tools/qemu_uefi_controller_e2e.py nvme
      - name: Publish failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: falcon-v2-qemu-controller-logs
          if-no-files-found: ignore
          retention-days: 14
          path: build/probe-*-debug.log
