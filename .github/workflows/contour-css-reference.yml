name: Contour live stylesheet color reference
on:
  workflow_dispatch:
  push:
    paths: [tools/probe_contour_css.py]
    branches: [feature/native-falco-wallpaper-setup-20261011]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p build
          python3 tools/probe_contour_css.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: contour-public-css-reference
          path: |
            build/contour-reference-source.html
            build/contour-reference.css
