name: Falco genuine HTTPS internet .app.pkg into Downloads
on:
  push:
    branches: [feature/native-falco-wallpaper-setup-20261011]
    paths:
      - tools/vnc_falco_download_e2e.py
      - tools/falcon_https_gateway.py
      - .github/workflows/falco-app-download.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  falco-download:
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
      - name: Build FalconOS with certified HTTPS and no Chromium
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm grub-common grub-pc-bin xorriso mtools qemu-system-x86 python3-venv
          python3 -m venv /tmp/fapp-env
          /tmp/fapp-env/bin/pip -q install pillow vncdotool
          PATH="/tmp/fapp-env/bin:$PATH" make iso ENABLE_BOOT_GLB=0 ENABLE_BEARSSL=1 EXTRA_CFLAGS='-DFALCON_QEMU_UI_GALLERY -DFALCON_QEMU_BROWSER_TEST'
      - name: Real Falco URL input to real HTTPS file downloaded in guest Files
        run: timeout 520s /tmp/fapp-env/bin/python tools/vnc_falco_download_e2e.py
      - name: Real QEMU screenshots and guest HTTPS tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-Falco-HTTPS-APP-PKG-Downloads-PNG
          path: |
            build/FalconOS-Falco-Real-HTTPS-AppPkg-Downloaded.png
            build/FalconOS-Downloads-Real-Internet-AppPkg.png
            build/FalconOS-Downloaded-AppPkg-DoubleClick-Running.png
            build/falco-app-download-results.json
            build/falco-app-download-debug.log
            build/falco-app-https-host.log
          if-no-files-found: warn
