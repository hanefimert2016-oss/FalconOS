name: FalconOS native OS Falco login wallpapers and FAPP packages
on:
  push:
    branches: [feature/native-falco-wallpaper-setup-20261011]
    paths:
      - kernel/**
      - tools/vnc_native_upgrade_e2e.py
      - tools/vnc_wallpaper_persistence_e2e.py
      - .github/workflows/native-falco-oneclick.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-os-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Build real FalconOS (no Chromium or AppImage)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm grub-common grub-pc-bin xorriso mtools qemu-system-x86 python3-venv
          python3 -m venv /tmp/falcon-native
          /tmp/falcon-native/bin/pip -q install pillow vncdotool
          PATH="/tmp/falcon-native/bin:$PATH" make iso ENABLE_BOOT_GLB=0 ENABLE_BEARSSL=1 EXTRA_CFLAGS='-DFALCON_QEMU_BROWSER_TEST -DFALCON_QEMU_UI_GALLERY'
          grub-file --is-x86-multiboot2 build/falcon.elf
      - name: Verify actual native browser, installers, wallpaper, locked vs passwordless accounts
        run: timeout 590s /tmp/falcon-native/bin/python tools/vnc_native_upgrade_e2e.py
      - name: Verify actual persistent wallpaper and account across two boots
        run: timeout 430s /tmp/falcon-native/bin/python tools/vnc_wallpaper_persistence_e2e.py
      - name: Real PNG evidence, bootable ISO, guest test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-Native-OS-ISO-Real-QEMU-PNG
          path: |
            build/FalconOS.iso
            build/FalconOS-Falco-*.png
            build/FalconOS-Native-*.png
            build/FalconOS-Wallpaper-*.png
            build/FalconOS-Persistent-*.png
            build/FalconOS-New-Lockscreen-*.png
            build/native-*.json
            build/persist-*.json
            build/native-*.log
            build/persist-*.log
          if-no-files-found: warn
