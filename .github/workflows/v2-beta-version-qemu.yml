name: FalconBoot native UEFI GRUB-free QEMU verification
on:
  push:
    branches: [v2-beta]
    paths:
      - kernel/apps.c
      - kernel/marketplace.c
      - kernel/fapp_policy.c
      - kernel/falcon.h
      - tools/marketplace_bridge.py
      - tests/test_bridge_protocol.py
      - kernel/launchpad.c
      - kernel/personal.c
      - kernel/aeroflow.h
      - kernel/os_update.c
      - kernel/falco_html_text.c
      - kernel/falco_html_text.h
      - linux/pci_extended.c
      - tests/falco_html_test.c
      - kernel/version.h
      - tools/falcon_os_update_bridge.py
      - tests/test_os_update_bridge.py
      - tests/test_qemu_boot_priority.py
      - kernel/gfx.c
      - kernel/main.c
      - kernel/version.h
      - kernel/calendar_math.c
      - kernel/calendar_math.h
      - kernel/settings.c
      - boot/falcon_uefi/loader.c
      - boot/falcon_uefi/uefi.h
      - boot/falcon_uefi/handoff.S
      - linker.ld
      - Makefile
      - tests/calendar_math_test.c
      - tests/test_v2_release_identity.py
      - tests/test_aeroflow_shell.py
      - tools/vnc_falco_codedium_e2e.py
      - .github/workflows/v2-beta-version-qemu.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  v2-beta-branding:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - name: Install ISO compiler, QEMU, VNC and real screenshot dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nasm xorriso mtools qemu-system-x86 ovmf clang lld fonts-dejavu-core python3-venv binutils
          python3 -m venv /tmp/falcon-v2-venv
          /tmp/falcon-v2-venv/bin/pip install --quiet pillow vncdotool
      - name: Run all Python regression tests including V2 version checks
        run: /tmp/falcon-v2-venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Verify actual Gregorian calendar arithmetic on host
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ikernel tests/calendar_math_test.c kernel/calendar_math.c -o /tmp/v2-cal-test
          /tmp/v2-cal-test
      - name: Validate Falco semantic HTML parser with native host compiler
        run: |
          gcc -std=c11 -Wall -Wextra -Werror -Ikernel tests/falco_html_test.c kernel/falco_html_text.c -o /tmp/falco-html-test
          /tmp/falco-html-test
      - name: Build native bootable V2 ISO
        run: |
          PATH="/tmp/falcon-v2-venv/bin:$PATH" make iso ENABLE_BOOT_GLB=0 ENABLE_BEARSSL=0 EXTRA_CFLAGS='-DFALCON_QEMU_UI_GALLERY -DFALCON_QEMU_AEROFLOW_TEST'
          file build/BOOTX64.EFI
          file build/BOOTX64.EFI | grep -F 'PE32+'
          test -s build/FALCON-KERNEL.BIN
          test -s build/FalconOS.iso
          strings build/falcon.elf | grep -F 'FalconOS 2.0 Beta'
          strings build/falcon.elf | grep -F 'V2 BETA'
          ! test -e boot/grub.cfg
          ! grep -q 'grub-mkrescue' Makefile
      - name: Launch V2 in real QEMU and photograph About, Terminal and RTC Calendar
        run: timeout 480s /tmp/falcon-v2-venv/bin/python tools/vnc_falco_codedium_e2e.py
      - name: Upload actual unedited QEMU screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FalconBoot-UEFI-QEMU-Loader-And-Desktop-Real-PNG
          path: |
            build/FalconOS-V2-FalconBoot-UEFI-Loader.png
            build/FalconOS-V2-Beta-*.png
            build/FalconOS-V2-Gregorian-Calendar-*.png
            build/FalconOS-V2-Alpha-Channel-Real-QEMU.png
            build/FalconOS-V2-Beta-Channel-Real-QEMU.png
            build/FalconOS-V2-PCI-Devices-Real-QEMU.png
            build/FalconOS-Review-Desktop.png
            build/FalconOS-V2-Discover-*.png
            build/FalconOS-V2-Native-System-Updater*.png
            build/FalconOS-V2-AeroFlow-Launcher.png
            build/FalconOS-V2-AeroFlow-Light.png
            build/FalconOS-V2-AeroFlow-Dark.png
            build/FalconOS-V2-AeroFlow-Search.png
            build/falco-codedium-review-result.json
            build/falco-codedium-review-guest.log
            build/falco-codedium-review-qemu.log
            build/falcon-market-qa-bridge.log
          if-no-files-found: warn
          retention-days: 30
      - name: Upload verified V2 Beta bootable ISO
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FalconOS-V2-Native-FalconBoot-GRUB-Free-ISO
          path: build/FalconOS.iso
          retention-days: 30
