name: Build FLM v2.6 Android

on:
  push:
    branches:
      - flm-v2.6-android-build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Reconstruct and verify FLM source
        shell: bash
        run: |
          set -euo pipefail
          cd .flm-build-src
          base64 --decode FLM-v2.6-build-source.tar.xz.b64 > FLM-v2.6-build-source.tar.xz
          sha256sum -c SHA256.txt
          mkdir -p ../_flm_source
          tar -xJf FLM-v2.6-build-source.tar.xz -C ../_flm_source
          test -f ../_flm_source/FLM-v2.6-Android-EmbeddedPython/app/build.gradle
          test "$(wc -l < ../_flm_source/FLM-v2.6-Android-EmbeddedPython/app/src/main/python/flm_data/core_semantics.jsonl)" -eq 69724

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 36 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.4.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Build debug APK
        working-directory: _flm_source/FLM-v2.6-Android-EmbeddedPython
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="_flm_source/FLM-v2.6-Android-EmbeddedPython/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          cp "$APK" FLM-v2.6-Android-debug.apk
          sha256sum FLM-v2.6-Android-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FLM-v2.6-Android-debug
          path: FLM-v2.6-Android-debug.apk
          if-no-files-found: error
          retention-days: 30
